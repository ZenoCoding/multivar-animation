<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Focus Brackets -->
  <path d="M 100 170 L 100 100 L 170 100" stroke="#4facfe" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 342 100 L 412 100 L 412 170" stroke="#4facfe" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 100 342 L 100 412 L 170 412" stroke="#4facfe" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 342 412 L 412 412 L 412 342" stroke="#4facfe" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Field Streamlines (Center) -->
  <path d="M 140 290 C 190 140, 320 370, 372 222" stroke="url(#flow-grad)" stroke-width="38" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 160 330 C 210 200, 300 410, 345 285" stroke="url(#flow-grad)" stroke-width="14" stroke-linecap="round" opacity="0.6" />
  <path d="M 120 250 C 170 80, 340 330, 392 165" stroke="url(#flow-grad)" stroke-width="14" stroke-linecap="round" opacity="0.4" />
</svg>